<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Pass Editor</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <h1 class="title">Low-Pass Editor</h1>
      </div>
      <div class="header-right">
        <button id="open-btn" class="btn btn-primary">Open Audio</button>
        <div id="clip-info" class="clip-info" style="display: none;">
          <span id="file-name" class="file-name"></span>
          <span id="trim-duration" class="trim-duration"></span>
        </div>
      </div>
    </header>

    <div id="drop-zone" class="drop-zone">
      <div class="drop-zone-content">
        <div class="drop-icon">&#9835;</div>
        <p class="drop-text">Drop an audio file here</p>
        <p class="drop-subtext">or click "Open Audio" above</p>
        <p class="drop-formats">WAV, MP3, OGG, FLAC, AAC</p>
      </div>
      <input type="file" id="file-input" accept="audio/*" style="display: none;">
    </div>

    <div id="editor-area" class="editor-area" style="display: none;">
      <div class="waveform-section">
        <div class="section-header">
          <span class="section-label">Waveform &amp; Trim</span>
          <div class="zoom-controls">
            <label class="control-label">Zoom</label>
            <input id="zoom-slider" type="range" class="zoom-slider" min="1" max="50" value="1" step="0.5">
            <button id="zoom-reset-btn" class="btn btn-small">Reset</button>
          </div>
        </div>
        <canvas id="waveform-canvas" class="waveform-canvas"></canvas>
      </div>

      <div class="automation-section">
        <div class="section-header">
          <span class="section-label">Low-Pass Cutoff Automation</span>
          <span id="marker-display" class="marker-display" style="display: none;"></span>
        </div>
        <canvas id="automation-canvas" class="automation-canvas"></canvas>
      </div>

      <div class="controls-bar">
        <div class="controls-left">
          <div class="control-group">
            <label class="control-label">Low-pass</label>
            <select id="slope-select" class="control-select">
              <option value="12">12 dB/oct</option>
              <option value="24" selected>24 dB/oct</option>
              <option value="48">48 dB/oct</option>
            </select>
          </div>
        </div>

        <div class="controls-center">
          <span id="time-display" class="time-display">0.00s</span>
        </div>

        <div class="controls-right">
          <button id="play-btn" class="btn btn-transport">&#9654; Play</button>
          <button id="stop-btn" class="btn btn-transport">&#9632; Stop</button>
          <div class="export-group">
            <button id="export-audio-btn" class="btn btn-export">Export Audio</button>
            <button id="export-timestamps-btn" class="btn btn-export-secondary" disabled style="opacity: 0.4;">Export Timestamps</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
